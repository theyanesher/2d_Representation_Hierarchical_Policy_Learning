defaults:
  - _self_
  - task: high_level_heatmap_cnn_zarr_dataloader_EARLY_PUSH_BUTTONS

name: MLP_BC_OVERFIT_TEST
_target_: diffusion_policy.workspace.train_MLP_policy_hybrid_workspace.TrainMLPHybridWorkspace

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "default"

horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
obs_as_global_cond: True


policy:
  _target_: diffusion_policy.policy.MLP_hybrid_image_policy.MLPHybridImagePolicy

  shape_meta: ${shape_meta}
  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  obs_as_global_cond: ${obs_as_global_cond}
  crop_shape: [76, 76]
  obs_encoder_group_norm: True
  eval_fixed_crop: True
  lang_cond: True
  impainting: True   # True=predict full horizon (16 steps), False=predict committed steps only (8 steps)
  # MLP hidden layer sizes — increase for more capacity
  mlp_hidden_dims: [1024, 512, 256]


ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999


dataloader:
  batch_size: 128
  num_workers: 8
  shuffle: False
  pin_memory: False
  persistent_workers: False

val_dataloader:
  batch_size: 32
  num_workers: 4
  shuffle: False
  pin_memory: False
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: False          # start fresh — flip to True once you have a checkpoint
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 3050
  gradient_accumulate_every: 1
  use_ema: False         # EMA less important for deterministic MLP; enable if desired
  rollout_every: 50
  checkpoint_every: 100
  val_every: 1
  no_validation: True
  sample_every: 50        # MSE eval frequency (epochs); lower = more frequent logging
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  project: mlp_policy_debug
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: train_loss
    mode: max
    k: 10
    format_str: 'epoch={epoch:04d}-train_loss={train_loss:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
