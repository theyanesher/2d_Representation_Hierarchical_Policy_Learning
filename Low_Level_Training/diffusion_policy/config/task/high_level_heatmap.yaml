name: high_level_heatmap

obs_dim: 60
action_dim: 8
keypoint_dim: 3

image_shape: &image_shape [18, 128, 128] # 15
shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    image:
      shape: *image_shape
      type: rgb
    agent_pos:
      shape: [8]
      type: low_dim
  action:
    shape: [8]
dataset_dir: &dataset_dir data/kitchen

env_runner:
  _target_: diffusion_policy.env_runner.kitchen_lowdim_runner.KitchenLowdimRunner
  dataset_dir: *dataset_dir
  n_train: 6
  n_train_vis: 2
  train_start_seed: 0
  n_test: 50
  n_test_vis: 4
  test_start_seed: 100000
  max_steps: 280
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  render_hw: [240, 360]
  fps: 12.5
  past_action: ${past_action_visible}
  n_envs: null

dataset:
  _target_: diffusion_policy.dataset.High_Level_Heatmap_Train.HighLevelHeatmapTrain
  image_path:  /project_data/held/pratik/run_sample_basic_experiments/Bimanual_Manipulation/RVT2_GMM_Codebase/RVT2_Codebase/RVT/outputs_11th/unnormalized_rgb #data/High_Level_Heatmaps_Train_Data_Final/image
  heatmap_path: /project_data/held/pratik/run_sample_basic_experiments/Bimanual_Manipulation/RVT2_GMM_Codebase/RVT2_Codebase/RVT/outputs_11th/unnormalized_heatmap_images #data/High_Level_Heatmaps_Train_Data_Final/heatmap
  low_dim_path: /project_data/held/pratik/run_sample_basic_experiments/Bimanual_Manipulation/RVT2_GMM_Codebase/RVT2_Codebase/RVT/outputs_11th/gripper_pose #data/High_Level_Heatmaps_Train_Data_Final/low_dim
  depth_path: "/project_data/held/pratik/run_sample_basic_experiments/Bimanual_Manipulation/RVT2_GMM_Codebase/RVT2_Codebase/RVT/outputs_11th/depth/"
  use_wrist_camera: True
  sequence_length: 16
  pad_before: 4
  pad_after: 4
