defaults:
  - _self_
  - task: articubot_pc_abs_train

name: train_transformer_dp3
_target_: equi_diffpo.workspace.train_articubot_workspace.TrainArticubotWorkspace

shape_meta: ${task.shape_meta}
exp_name: "first_working_train_maybe"

task_name: square_d0
n_demo: 1000
horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
test_start_seed: 100000
dataset_obs_steps: ${n_obs_steps}
past_actions_visible: False
obs_as_cond: True
dataset_target: equi_diffpo.dataset.robomimic_replay_point_cloud_dataset.RobomimicReplayPointCloudDataset
dataset_path: data/robomimic/datasets/${task_name}/${task_name}_pcd_abs.hdf5
test_dataset_path: data/robomimic/datasets/${task_name}/for_oracle/${task_name}_150_pcd_abs.hdf5
goal_conditioning: True

high_level: weighted_displacement
high_level_dir: none

policy:
  _target_: equi_diffpo.policy.transformer_dp3.TransformerDP3
  shape_meta: ${shape_meta}
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small # Yilun's paper uses fixed_small_log instead, but easy to cause Nan
    clip_sample: True # required when predict_epsilon=False
    prediction_type: epsilon # or sample

  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 100

  crop_shape: [76, 76]
  encoder_output_dim: 64

  n_layer: 8
  n_cond_layers: 0  # >0: use transformer encoder for cond, otherwise use MLP
  n_head: 4
  n_emb: 256
  p_drop_emb: 0.0
  p_drop_attn: 0.3
  causal_attn: True
  time_as_cond: True # if false, use BERT like encoder only arch, time as input
  obs_as_cond: ${obs_as_cond}

  use_pc_color: true
  pointnet_type: "act3d"
  goal_conditioning: ${goal_conditioning}

  pointcloud_encoder_cfg:
    in_channels: 3
    out_channels: ${policy.encoder_output_dim}
    use_layernorm: true
    final_norm: layernorm # layernorm, none 
    normal_channel: false
    goal_conditioning: ${goal_conditioning}

ema:
  _target_: equi_diffpo.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 128
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 128
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: True

optimizer:
  transformer_weight_decay: 1.0e-3
  obs_encoder_weight_decay: 1.0e-6
  learning_rate: 1.0e-4
  betas: [0.9, 0.95]

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: ${eval:'int(50000 / ${n_demo})'}
  gradient_accumulate_every: 1
  use_ema: True
  rollout_every: ${eval:'int(1000 / ${n_demo})'}
  checkpoint_every: ${eval:'int(1000 / ${n_demo})'}
  val_every: 1
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0
  add_noise_to_goal: False
  translation_noise: 5.0e-3
  pertubation_noise: 5.0e-6
  use_high_level_goal: False
  high_level_goal_ratio: 0.5 # between 0 and 1.0

enable_wandb: True
logging:
  project: transformer_dp3_${task_name}
  resume: true
  mode: online
  name: transformer_dp3_${n_demo}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  save_ckpt: True # if True, save checkpoint every checkpoint_every
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 1
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: True # this only saves when save_ckpt is True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}