# custom setting
articubot:
  data_beg_ratio: 0.0
  data_end_ratio: 1.0
  data_val_ratio: 0.1
  add_one_hot_encoding: false
  output_obj_pcd_only: false
  weight_loss_weight: 10.0
  train_frequency: 1
  loss_scale: 1
  camera_frame: 0
  
  dataloader:
    batch_size: 15
    num_workers: 12
    shuffle: false
    pin_memory: true
    persistent_workers: false

  dataset:
    only_first_stage: false
    use_all_data: true
    use_combined_action: false
    dataset_prefix: /project_data/held/chenyuah/RoboGen-sim2real/data/dp3_demo/165-obj
    # dataset_prefix: /scrtach/yufeiw2/dp3_demo
    num_train_objects: "50"
    predict_two_goals: false

cgn: 
  loss_scale: 0.0002
  train_frequency: 1
  batch_size: 1
  DATA:
    further_fps_point: 0
    classes: null
    data_path: /project_data/held/yufeiw2/contact_graspnet_pytorch/acronym
    # data_path: /scrtach/yufeiw2/acronym
    depth_augm:
      clip: 0.005
      gaussian_kernel: 0
      sigma: 0.001
    gripper_width: 0.08
    input_normals: false
    intrinsics: realsense
    labels:
      bin_weights:
      - 0.16652107
      - 0.21488856
      - 0.37031708
      - 0.55618503
      - 0.75124664
      - 0.93943357
      - 1.07824539
      - 1.19423112
      - 1.55731375
      - 3.17161779
      filter_z: true
      k: 1
      max_radius: 0.005
      num_neg_contacts: 0
      num_pos_contacts: 8000
      offset_bins:
      - 0
      - 0.00794435329
      - 0.0158887021
      - 0.0238330509
      - 0.0317773996
      - 0.0397217484
      - 0.0476660972
      - 0.055610446
      - 0.0635547948
      - 0.0714991435
      - 0.08
      to_gpu: false
      z_val: -0.1
    ndataset_points: 20000
    num_point: 2048
    num_test_scenes: 1000
    pc_augm:
      clip: 0.005
      occlusion_dropout_rate: 0.0
      occlusion_nclusters: 0
      sigma: 0.0
    raw_num_points: 20000
    scene_contacts_path: scene_contacts
    train_and_test: false
    train_on_scenes: true
    use_farthest_point: false
    use_uniform_quaternions: false
    view_sphere:
      distance_range:
      - 0.9
      - 1.3
      elevation:
      - 30
      - 150
  LOSS:
    four_point_loss: true
    min_geom_loss_divisor: 1.0
    offset_loss_type: sigmoid_cross_entropy
    too_small_offset_pred_bin_factor: 0
    topk_confidence: 512
    # gmm_fixed_variance: [0.001, 0.01, 0.05]
    gmm_fixed_variance: [0.001]
  MODEL:
    model_type: default_cgn # articubot_pointnet_super
    loss_mode: articubot_gmm # contact_graspnet_4_points, articubot_gmm
    use_gt_gripper_q: false # false performs better
    articubot_four_point_format: false
    gmm_gmm_take_min_over_sym: false
    grad_schimit_4_points: false
    asymmetric_model: true
    bin_offsets: true
    dir_vec_length_offset: false
    grasp_conf_head:
      conv1d: 1
      dropout_keep: 0.5
    grasp_dir_head:
      conv1d: 3
      dropout_keep: 0.7
    joint_head:
      conv1d: 4
      dropout_keep: 0.7
    joint_heads: false
    model: contact_graspnet
    pointnet_fp_modules:
    - mlp:
      - 256
      - 256
    - mlp:
      - 256
      - 128
    - mlp:
      - 128
      - 128
      - 128
    pointnet_sa_module:
      group_all: true
      mlp:
      - 256
      - 512
      - 1024
    pointnet_sa_modules_msg:
    - mlp_list:
      - - 32
        - 32
        - 64
      - - 64
        - 64
        - 128
      - - 64
        - 96
        - 128
      npoint: 2048
      nsample_list:
      - 32
      - 64
      - 128
      radius_list:
      - 0.02
      - 0.04
      - 0.08
    - mlp_list:
      - - 64
        - 64
        - 128
      - - 128
        - 128
        - 256
      - - 128
        - 128
        - 256
      npoint: 512
      nsample_list:
      - 64
      - 64
      - 128
      radius_list:
      - 0.04
      - 0.08
      - 0.16
    - mlp_list:
      - - 64
        - 64
        - 128
      - - 128
        - 128
        - 256
      - - 128
        - 128
        - 256
      npoint: 128
      nsample_list:
      - 64
      - 64
      - 128
      radius_list:
      - 0.08
      - 0.16
      - 0.32
    pred_contact_approach: false
    pred_contact_base: false
    pred_contact_offset: true
    pred_contact_success: true
    pred_grasps_adds: true
    pred_grasps_adds_gt2pred: false
    pred_4_points_loss: true
  OPTIMIZER:
    adds_gt2pred_loss_weight: 0
    adds_loss_weight: 10
    approach_cosine_loss_weight: 0
    four_points_loss_weight: 10
    backup_every: 2000
    batch_size: ${cgn.batch_size}
    bn_decay_clip: 0.99
    bn_decay_decay_rate: 0.5
    bn_decay_decay_step: 200000
    bn_init_decay: 0.5
    checkpoint_every: 100
    decay_rate: 0.7
    decay_step: 200000
    dir_cosine_loss_weight: 0
    learning_rate: 0.001
    max_epoch: 400
    momentum: 0.9
    offset_loss_weight: 1
    optimizer: adam
    print_every: 10
    score_ce_loss_weight: 1
    val_every: 1
  TEST:
    first_thres: 0.15
    second_thres: 0.15
    allow_zero_margin: 0
    bin_vals: max
    center_to_tip: 0.0
    extra_opening: 0.005
    max_farthest_points: 150
    num_samples: 200
    with_replacement: false
    filter_thres: 0.0001
    max_num_grasps: 20


general:
  num_iterations: 500000
  save_freq: 2500
  load_model_path: /project_data/held/yufeiw2/articubot_multitask/RoboGen-sim2real/ptv3/data/articubot_cgn_ptv3-first-try/2025.08.02/18.10.23/model_122500.pth
  exp_name: articubot_cgn_ptv3-first-try
  add_one_hot_encoding: 0
  keep_gripper_in_fps: 0
  exp_path: /project_data/held/yufeiw2/articubot_multitask/RoboGen-sim2real/ptv3/exps
  tasks: [articubot, cgn]
  fp_to_full: 0
  first_sa_point: 2048
  replace_bn_with_gn: 0
  replace_bn_with_in: 0
  replace_bn_with_ln: 1
  category_embedding_type: siglip
  film_in_sa_and_fp: 0
  embedding_as_input: 0
  

# model settings
patch_size: 128
model:
  _target_: ptv3.highlevel_ptv3.HighlevelPTv3
  grid_size: 0.005
  ptv3_config:
    in_channels: 771 # 3 + 768
    order:
      - z
      - z-trans
      - hilbert
      - hilbert-trans
    stride:
      - 2
      - 2
      - 2
      - 2
    enc_depths:
      - 2
      - 2
      - 2
      - 6
      - 2
    enc_channels:
      - 32
      - 64
      - 128
      - 256
      - 512
    enc_num_head:
      - 2
      - 4
      - 8
      - 16
      - 32
    enc_patch_size:
      - ${patch_size}
      - ${patch_size}
      - ${patch_size}
      - ${patch_size}
      - ${patch_size}
    dec_depths:
      - 2
      - 2
      - 2
      - 2
    dec_channels:
      - 64
      - 64
      - 128
      - 256
    dec_num_head:
      - 4
      - 4
      - 8
      - 16
    dec_patch_size:
      - ${patch_size}
      - ${patch_size}
      - ${patch_size}
      - ${patch_size}
    mlp_ratio: 4
    qkv_bias: true
    qk_scale: null
    attn_drop: 0.0
    proj_drop: 0.0
    drop_path: 0.3
    shuffle_orders: true
    pre_norm: true
    enable_rpe: false
    enable_flash: true
    upcast_attention: false
    upcast_softmax: false
    cls_mode: false
    pdnorm_bn: false
    pdnorm_ln: false
    pdnorm_decouple: true
    pdnorm_adaptive: false
    pdnorm_affine: true
    pdnorm_conditions:
      - ScanNet
      - S3DIS
      - Structured3D
    embedding_dim: 768
  weight_head_mlp_config:
    hidden_channels:
      - 128
      - 128
      - 1 # output dim
  offset_head_mlp_config:
    hidden_channels:
      - 128
      - 128
      - 12
  fps_num: 2048
    

training:
  seed: 42
  log_every_batches: 2
  checkpoint_every_epoch: 1

# scheduler settings
optimizer:
  type: AdamW
  lr: 0.001
  # weight_decay: 0.05
scheduler:
  type: OneCycleLR
  max_lr:
    - 0.001
    - 0.0001
  pct_start: 0.05
  anneal_strategy: cos
  div_factor: 10.0
  final_div_factor: 1000.0
param_dicts:
  - keyword: block
    lr: 0.0001

hydra:
  job:
    override_dirname: ${general.exp_name}
  run:
    dir: data/${general.exp_name}/${now:%Y.%m.%d}/${now:%H.%M.%S}
  sweep:
    dir: data/${general.exp_name}/${now:%Y.%m.%d}/${now:%H.%M.%S}
    subdir: ${hydra.job.num}
