defaults:
  - _self_
  - task: articubot
  - visual_encoder: resnet  # override with visual_encoder=resnet_prope|dinov2|dinov3

name: flow_matching_dit
_target_: diffusion_policy.workspace.train_diffusion_unet_hybrid_workspace.TrainDiffusionUnetHybridWorkspace

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "default"

horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_global_cond: True   # kept for dataset/dataloader compat; not used by this policy
observation_mode: "image"  # change to "plucker_early_fusion" etc. if needed
action_mode: "hybrid_delta"

policy:
  _target_: diffusion_policy.policy.flow_matching_dit_image_policy.FlowMatchingDiTImagePolicy

  shape_meta: ${shape_meta}
  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  observation_mode: ${observation_mode}

  # ---- crop augmentation ----
  # Random crop during training, center crop at eval. Input images are 256×256.
  crop_shape: [224, 224]

  # ---- visual token encoder ----
  # Configured via the visual_encoder config group (defaults to resnet).
  # Override at launch: visual_encoder=resnet_prope|dinov2|dinov3

  # ---- flow matching noise schedule ----
  # Flow matching converges in far fewer steps than DDPM; 10-50 is typical.
  num_inference_timesteps: 10
  noise_beta_alpha: 1.5
  noise_beta_beta: 1.0
  noise_s: 0.999
  num_timestep_buckets: 1000

  # ---- architecture ----
  # CONSTRAINT: input_embedding_dim == num_attention_heads * attention_head_dim
  # CONSTRAINT: hidden_size         == diffusion_model_cfg.output_dim
  hidden_size: 1024 # 512,768,1024
  input_embedding_dim: ${policy.hidden_size}
  add_pos_embed: False
  max_seq_len: 64   # must be >= action_horizon (16 is safe with 64)

  # Set to true to route goal tokens through dedicated DiT cross-attention layers
  # (one cross-attn to goals before every visual cross-attn block).
  use_goal_cross_attention: false

  # Set to true to use GMM probabilities as a log-prior bias on goal cross-attention logits:
  #   logits += log(w_j)  — requires use_goal_cross_attention=true and GMM obs keys.
  use_weighted_cross_attention: false

  # Set to true to run goal-CA and visual-CA in parallel inside each cross-attn block
  # (both read the pre-block hidden_states, outputs are concat'd along feature dim and
  # projected back to D before the residual add). Requires use_goal_cross_attention=true.
  # Composable with use_weighted_cross_attention.
  use_parallel_cross_attentions: false

  # Set to true to multiply the goal-CA output by a learnable scalar α_goal init=0 before
  # adding to the residual (serial) or concat-fusing (parallel). Vision residual is never
  # gated. ReZero-style asymmetric gate that hands vision the head start in optimization.
  # Requires use_goal_cross_attention=true. Composable with the flags above.
  use_gated_goal_residual: false

  # Idea 1: route the WCA output to GoalAdaLN as per-token (γ_goal, β_goal) conditioning
  # for the visual-CA's norm, instead of adding it to the residual stream. Only visual CA
  # writes to the residual — hard architectural ceiling on goal influence. Requires
  # use_goal_cross_attention=true. Mutually exclusive with use_parallel_cross_attentions
  # and use_gated_goal_residual.
  use_goal_adaln_modulation: false

  # Dual-stream architecture (GoalAuxiliaryStream): replaces the DiT block chain with
  # GoalAuxiliaryStreamBlocks — two parallel hidden_states streams with per-block
  # CA-to-vision (stream 1), WCA-to-goal (stream 2), joint self-attention with
  # per-stream Q/K/V/out, and per-stream FFN. Only stream 1 is decoded at the end.
  # Requires use_goal_cross_attention=true. Mutually exclusive with the other three
  # goal-routing flags above.
  use_goal_auxiliary_stream: false

  # When true, encode 10-D state as 3 sub-tokens per obs step (pos/rot/gripper) with
  # learned per-component identity + temporal embeddings, instead of one SimpleMLP
  # token per obs step. Assumes the standard MimicGen Panda 10-D state layout.
  use_per_component_state: false

  # When true, every BasicTransformerBlock's norm1 becomes a StateAdaLN that adds
  # per-channel state-derived (γ, β) modulation on top of temb-derived (γ, β).
  # The state branch is zero-init so behavior matches standard AdaLN at step 0.
  # Mutually exclusive with use_goal_adaln_modulation. Currently not supported
  # alongside use_goal_auxiliary_stream.
  use_state_adaln: false

  # Diagnostic: register backward hooks on every cross-attn block to record
  # ‖∂L/∂WCA_out‖ and ‖∂L/∂CA_out‖. The workspace logs per-block means each epoch.
  # Safe to combine with any of the flags above.
  log_attention_grad_norms: false

  # Keep only the top-K GMM candidates by weight before encoding.
  # Useful with use_goal_cross_attention=false (self-attention) to bound sequence length.
  # null = use all candidates.
  gmm_top_k: null

  diffusion_model_cfg:
    # inner_dim = num_attention_heads * attention_head_dim = 8 * 64 = 512
    num_attention_heads: ${eval:'${policy.hidden_size} // ${policy.diffusion_model_cfg.attention_head_dim}'}
    attention_head_dim: 64
    # output_dim MUST equal hidden_size above (512)
    output_dim: ${policy.hidden_size}
    num_layers: 12
    dropout: 0.1
    attention_bias: true
    activation_fn: gelu-approximate
    num_embeds_ada_norm: 1000
    norm_type: ada_norm
    final_dropout: true
    positional_embeddings: sinusoidal
    max_num_positional_embeddings: 64
    interleave_self_attention: true
    use_goal_cross_attention: ${policy.use_goal_cross_attention}
    use_weighted_cross_attention: ${policy.use_weighted_cross_attention}
    use_parallel_cross_attentions: ${policy.use_parallel_cross_attentions}
    use_gated_goal_residual: ${policy.use_gated_goal_residual}
    use_goal_adaln_modulation: ${policy.use_goal_adaln_modulation}
    use_goal_auxiliary_stream: ${policy.use_goal_auxiliary_stream}
    use_state_adaln: ${policy.use_state_adaln}
    log_attention_grad_norms: ${policy.log_attention_grad_norms}

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: False #False
  # optimization
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 100
  gradient_accumulate_every: 1
  use_ema: True
  # training loop control (epochs)
  rollout_every: 50
  checkpoint_every: 10
  val_every: 1
  sample_every: 5
  # steps per epoch (null = full epoch)
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  project: diffusion_policy
  resume: False # False
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  # ${name} intentionally omitted — it's already the WandB run name, and long
  # experiment names (>64 chars) blow past WandB's tag length cap. Keep tags
  # short and categorical; filter by name in the WandB UI.
  tags: ["${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 5
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
