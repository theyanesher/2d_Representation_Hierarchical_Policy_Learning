name: sweep_to_dustpan_gmm_goal

# GMM (weighted cross-attention) counterpart of sweep_to_dustpan_goal_gripper.yaml.
# Same RL Bench layout (4 cameras @ 128x128, native 8-D state/action), but the
# goal conditioning is the FULL high-level GMM distribution
# (gmm_all_goals + gmm_all_weights) instead of the single ground-truth
# goal_gripper_pts. Consumed by FlowMatchingDiTImagePolicy with
# use_goal_cross_attention=true + use_weighted_cross_attention=true.
image_shape: &image_shape [3, 128, 128]

# Native RL Bench layout (no conversion to the MimicGen 10-D / 6D-rotation form):
#   state  = [pos(3), quat(4), gripper(1)] = 8
#   action = [pos(3), quat(4), gripper(1)] = 8  (absolute next pose)
# action_mode stays the default (hybrid_delta), which reads action/hybrid as-is
# and range-normalizes it — no 10-D / 6D assumption.
shape_meta: &shape_meta
  obs:
    cam0_image:            # front
      shape: *image_shape
      type: rgb
    cam1_image:            # left_shoulder
      shape: *image_shape
      type: rgb
    cam2_image:            # right_shoulder
      shape: *image_shape
      type: rgb
    cam3_image:            # wrist
      shape: *image_shape
      type: rgb
    state:
      shape: [8]
      type: low_dim
    gmm_all_goals:
      shape: [4500, 4, 3]  # all anchor goal predictions from the high-level GMM
      type: gmm_goals
    gmm_all_weights:
      shape: [4500]         # softmax probability of each anchor
      type: gmm_weights
  action:
    shape: [8]

# Kept for config-shape parity with the MimicGen tasks. The workspace does NOT
# instantiate the env_runner for RL Bench (the call is commented out), so this
# is dead config and the MimicGen ArticubotImageRunner is never created.
env_runner:
  _target_: diffusion_policy.env_runner.articubot_image_runner.ArticubotImageRunner
  n_train: 6
  n_train_vis: 2
  train_start_seed: 0
  n_test: 50
  n_test_vis: 4
  legacy_test: True
  test_start_seed: 100000
  max_steps: 300
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  fps: 10
  past_action: ${past_action_visible}
  n_envs: null
  observation_mode: image

dataset:
  _target_: diffusion_policy.dataset.lazy_articubot_dataset.LazyArticuBotDataset
  shape_meta: *shape_meta
  # Overridden by the launch script (task.dataset.data_dir=<staged scratch dir>).
  data_dir: /PLACEHOLDER/RL_BENCH_WITH_GMM_H5/Sweep_To_Dustpan_Of_Size
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  seed: 42
  val_ratio: 0.02
  max_train_episodes: null
  action_mode: ${action_mode}
