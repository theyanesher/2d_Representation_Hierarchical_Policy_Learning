name: franka_push_block_gmm_goal_gt_mix

# GT / predicted goal-MIX variant of the real-world Franka push-block task,
# analogous to coffee_preperation_gmm_goal_gt_mix.yaml (the RDP-style
# lazy-npz variant, not the baked-h5 HAMMER_CLEANUP_D1 variant). data_dir
# points at the plain NO_GMM h5 (obs/goal_gripper_pts, images, state,
# action — same h5 the franka_push_block_goal_gripper baseline uses); the
# GMM predictions and GT goals are NOT baked into it. Instead the launch
# script (franka_push_block_wca_dinov2_uvd_gtmix.sh) passes two extra
# dataset kwargs at the CLI (not in this yaml, since LazyArticuBotDataset /
# LazyArticuBotGtMixDataset accept them as optional constructor args):
#   +task.dataset.gmm_pred_npz_dir=<EXTRA_KEYPOINTS/FRANKA_PUSH_BLOCK_UVD_GMM_PRED>
#   +task.dataset.gmm_pred_key_suffix=uvd
#   +task.dataset.gt_goal_npz_dir=<EXTRA_KEYPOINTS/FRANKA_PUSH_BLOCK>
#   +task.dataset.gt_goal_npz_key=goal_gripper_pcd_uvd
# The GMM prediction npz tree comes from running the UVD-subgoal-trained
# high-level articubot model (logs/train_frankaPushBlock_UVD_subgoals/
# 2026-08-14/15-33-24, best-val checkpoint checkpoints/epoch=74-step=25425-val/
# rmse_and_std_combi=0.031.ckpt in the high-level repo) over the push-block
# npz tree via scripts/run_gmm_pred_to_npz.py
# (theya_ROBO_GMM_DATASET_GEN_SCRIPT/UVD_DATAGEN/frankaPushBlock.sh) — run
# that first. The GT npz tree is already complete (extracted from
# EXTRA_KEYPOINTS_uvd.tar).
#
# Same container as the plain full-GMM WCA task, but the dataset is the
# additive subclass LazyArticuBotGtMixDataset: with per-item probability
# gt_mix_p it replaces the predicted GMM goals with a sparse ground-truth
# goal set; otherwise it passes the predicted GMM through unchanged. Train
# with use_weighted_cross_attention=true, gmm_top_k=6 (same recipe as the
# other gt_mix tasks).

image_shape: &image_shape [3, 256, 256]
shape_meta: &shape_meta
  obs:
    cam0_image:
      shape: *image_shape
      type: rgb
    cam1_image:
      shape: *image_shape
      type: rgb
    state:
      shape: [10]
      type: low_dim
    gmm_all_goals:
      shape: [4500, 4, 3]  # all anchor goal predictions from the high-level GMM
      type: gmm_goals
    gmm_all_weights:
      shape: [4500]         # softmax probability of each anchor
      type: gmm_weights
  action:
    shape: [10]

env_runner:
  _target_: diffusion_policy.env_runner.articubot_image_runner.ArticubotImageRunner
  n_train: 6
  n_train_vis: 2
  train_start_seed: 0
  n_test: 50
  n_test_vis: 4
  legacy_test: True
  test_start_seed: 100000
  max_steps: 300
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  fps: 10
  past_action: ${past_action_visible}
  n_envs: null
  observation_mode: image

dataset:
  _target_: diffusion_policy.dataset.lazy_articubot_gt_mix_dataset.LazyArticuBotGtMixDataset
  shape_meta: *shape_meta
  # Overridden by the launch script (task.dataset.data_dir=<staged scratch dir>).
  # Plain NO_GMM h5 (same as the goal_gripper baseline task) — GMM/GT come
  # from the npz overrides passed at launch, see comment above.
  data_dir: /jet/home/eswaramo/data/D2/NO_GMM_preds/franka_push_block_mimicgen
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  seed: 42
  val_ratio: 0.02
  max_train_episodes: null
  action_mode: ${action_mode}
  # --- GT / predicted goal mixing (this variant only) ---------------------
  gt_mix_p: 0.5             # P(use GT goals this sample); null => off (pure predicted)
  gt_transition_radius: 5   # +-window (frames) around a goal-change keyframe
  gt_transition_pmax: 0.5   # neighbor mode weight at the transition (-> 50/50)
