# @package policy
visual_encoder_type: vit_heatmap_rope
use_separate_wrist_encoder: False
visual_encoder_cfg:
  # Heatmap coord extraction
  # patch_size must match the RGB patch embed stride
  heatmap_channels: 4
  patch_size: 14
  # RoPE transformer layers (ViT from scratch, no pretrained weights)
  num_rope_layers: 4
  num_heads: 8
  ffn_dim: 2048
  dropout: 0.0
  use_flow_timestep_rope: False
  use_exact_cropping: False
  # When enabled: appends sinθ, cosθ of the direction from the projected gripper
  # centroid to each patch center, giving 6 RoPE axes instead of 4.
  # embed_dim will be auto-rounded down to the nearest multiple of 12.
  # Requires goal_gripper_pts and camera intrinsic/extrinsic keys in nobs.
  use_direction_axes_in_rope: False
