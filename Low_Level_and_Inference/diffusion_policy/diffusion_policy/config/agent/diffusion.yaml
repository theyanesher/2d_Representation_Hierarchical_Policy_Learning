defaults:
  - features: resnet_gn_nopool
  - _self_

_target_: dit_policy.models.diffusion.DiffusionTransformerAgent
odim: 10
n_cams: 3
use_obs: add_token
dropout: 0.1
train_diffusion_steps: 100
eval_diffusion_steps: 8
ac_dim: 10
ac_chunk: 16
imgs_per_cam: 2
share_cam_features: False
early_fusion: False
feat_norm: null

noise_net_kwargs:
  time_dim: 256
  hidden_dim: 512
  num_blocks: 6
  dim_feedforward: 2048
  dropout: ${agent.dropout}
  nhead: 8
  activation: "gelu"
